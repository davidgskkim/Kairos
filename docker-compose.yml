version: '3.8'

services:
  # Redis 
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  # Backend 
  api:
    build: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL="postgresql://postgres.nmknsbsdzbofxkahhtcx:KairosProject2025@aws-1-us-east-1.pooler.supabase.com:5432/postgres"
    depends_on:
      - redis
    volumes:
      - ./backend:/app 

  # Celery 
  worker:
    build: ./backend
    command: celery -A worker.celery_app worker --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL="postgresql://postgres.nmknsbsdzbofxkahhtcx:KairosProject2025@aws-1-us-east-1.pooler.supabase.com:5432/postgres"
    depends_on:
      - redis
      - api
    volumes:
      - ./backend:/app

  # Frontend
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules 